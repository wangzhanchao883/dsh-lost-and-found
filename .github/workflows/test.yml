name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      # Deliberately no `npm install`: the suite uses Node built-ins only
      # (`node:sqlite`, `node:fs`, `node:zlib`), so CI is hermetic — no registry
      # access, no credentials, no DSH, no network and nothing to cache.
      - name: Syntax check and offline self-test
        run: |
          node --version
          npm test
